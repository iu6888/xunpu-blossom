name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 接口回归（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 环境确认
        run: |
          node -v
          node -e "const s=require('node:sqlite'); console.log('node:sqlite 可用，导出：', Object.keys(s).join(', '))"

      - name: 语法检查
        run: |
          fail=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || { echo "语法错误：$f"; fail=1; }
          done
          exit $fail

      - name: 接口回归测试
        run: node --disable-warning=ExperimentalWarning --test test/api.test.js

      - name: 冷启动检查
        run: |
          PORT=3100 HOST=127.0.0.1 node --disable-warning=ExperimentalWarning server/index.js &
          server=$!
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3100/api/health > /dev/null 2>&1; then
              echo "健康检查通过"
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:3100/api/health
          echo
          curl -fsS --max-time 5 http://127.0.0.1:3100/api/products | head -c 200
          echo
          kill $server
