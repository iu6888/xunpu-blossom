# 蟳埔花事 · 静态站点部署配置（Netlify）
# 直接把 xunpu-blossom 文件夹拖到 Netlify 即可；若使用 Git 部署，本文件生效。

[build]
  publish = "."

# 404：Netlify 会自动使用根目录 404.html，这里显式声明一次
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# 静态资源长缓存（文件名不含哈希，用较长但有限的缓存期）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
